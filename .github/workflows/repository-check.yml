name: Repository check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository-check:
    name: Run tests and verify containers
    runs-on: ubuntu-latest

    env:
      TUTORPULSE_DB_HOST: 127.0.0.1
      TUTORPULSE_DB_PORT: 5432
      TUTORPULSE_DB_NAME: tutorpulse_test
      TUTORPULSE_DB_USER: postgres
      TUTORPULSE_DB_PASSWORD: ci_test_password

      TUTORPULSE_TEST_DB_HOST: 127.0.0.1
      TUTORPULSE_TEST_DB_PORT: 5432
      TUTORPULSE_TEST_DB_NAME: tutorpulse_test
      TUTORPULSE_TEST_DB_USER: postgres
      TUTORPULSE_TEST_DB_PASSWORD: ci_test_password

      TUTORPULSE_DOCKER_DB_PASSWORD: ci_docker_password

    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: tutorpulse_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tutorpulse_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-model.txt
            requirements-analysis.txt

      - name: Check required documentation exists
        run: |
          test -f README.md
          test -f docs/modelling-scope.md
          test -f docs/model-evaluation.md
          test -f docs/inference-contract.md
          test -f docs/model-card.md
          test -f docs/model-monitoring.md
          test -f docs/deployment-plan.md

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-analysis.txt
          python -m pip check

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Apply database migration
        env:
          PGPASSWORD: ci_test_password
        run: |
          psql \
            --host 127.0.0.1 \
            --port 5432 \
            --username postgres \
            --dbname tutorpulse_test \
            --set ON_ERROR_STOP=1 \
            --file database/migrations/001_create_initial_schema.sql

      - name: Compile Python files
        run: python -m compileall app analysis tests

      - name: Generate analysis data
        run: |
          python -m analysis.synthetic_data
          python -m analysis.modelling_dataset

      - name: Execute exploratory-analysis notebook
        run: |
          python -m jupyter nbconvert \
            --to notebook \
            --execute \
            analysis/notebooks/01_exploratory_analysis.ipynb \
            --output-dir /tmp \
            --output 01_exploratory_analysis.executed.ipynb \
            --ExecutePreprocessor.timeout=120

      - name: Verify model training and evaluation
        run: |
          python -m analysis.model_training
          python -m analysis.threshold_selection
          python -m analysis.model_comparison
          python -m analysis.error_analysis
          python -m analysis.model_interpretation
          python -m analysis.final_evaluation

      - name: Verify saved model artifact
        run: |
          python -m analysis.model_artifact
          test -f artifacts/models/tutorpulse_pipeline.joblib
          test -f artifacts/models/tutorpulse_metadata.json

      - name: Run complete test suite
        run: python -m pytest -v

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Build containerised inference service
        run: docker compose build api

      - name: Start read-only containerised demo
        env:
          TUTORPULSE_DEMO_READ_ONLY: "true"
        run: |
          docker compose up \
            --detach \
            --wait \
            --wait-timeout 180

      - name: Verify containerised public demo
        run: |
          python - <<'PY'
          import json
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          with urlopen(
              "http://127.0.0.1:8000/ready",
              timeout=10,
          ) as response:
              readiness = json.load(response)

          assert response.status == 200
          assert readiness == {
              "status": "ready",
              "database": "ready",
              "model": "ready",
          }

          with urlopen(
              "http://127.0.0.1:8000/model/health",
              timeout=10,
          ) as response:
              model_health = json.load(response)

          assert response.status == 200
          assert model_health == {
              "status": "ready",
              "model_name": "logistic_regression",
              "artifact_schema_version": 1,
              "decision_threshold": 0.38,
          }

          with urlopen(
              "http://127.0.0.1:8000/learners",
              timeout=10,
          ) as response:
              learners = json.load(response)

          assert response.status == 200
          assert isinstance(learners, list)
          assert [
              learner["display_name"]
              for learner in learners
          ] == [
              "Learner 001",
              "Learner 002",
              "Learner 003",
              "Learner 004",
          ]

          blocked_request = Request(
              "http://127.0.0.1:8000/learners",
              data=json.dumps(
                  {
                      "display_name": (
                          "Unauthorised Public Change"
                      )
                  }
              ).encode("utf-8"),
              headers={
                  "Content-Type": "application/json"
              },
              method="POST",
          )

          try:
              urlopen(
                  blocked_request,
                  timeout=10,
              )
          except HTTPError as error:
              blocked_response = json.load(error)
              assert error.code == 403
          else:
              raise AssertionError(
                  "Public database write was not blocked"
              )

          assert blocked_response == {
              "detail": (
                  "TutorPulse is running as a read-only "
                  "portfolio demo. Stored demonstration "
                  "data cannot be changed."
              )
          }

          payload = {
              "topic_name": "Algebra",
              "maximum_score": 20.0,
              "prior_assessment_count": 5,
              "prior_result_count": 18,
              "prior_average_percentage": 64.2,
              "prior_minimum_percentage": 42.0,
              "prior_maximum_percentage": 88.0,
              "prior_support_count": 6,
              "prior_support_rate": 0.3333,
              "previous_assessment_average_percentage": 61.5,
              "days_since_previous_assessment": 14,
              "prior_same_topic_count": 4,
              "prior_same_topic_average_percentage": 58.5,
              "prior_same_topic_latest_percentage": 62.0,
              "prior_same_topic_support_count": 2,
              "prior_intervention_count": 3,
              "prior_same_topic_intervention_count": 1,
              "prior_completed_intervention_count": 2,
          }

          prediction_request = Request(
              (
                  "http://127.0.0.1:8000/"
                  "predictions/support-risk"
              ),
              data=json.dumps(
                  payload
              ).encode("utf-8"),
              headers={
                  "Content-Type": "application/json"
              },
              method="POST",
          )

          with urlopen(
              prediction_request,
              timeout=10,
          ) as response:
              prediction = json.load(response)

          assert response.status == 200
          assert (
              0.0
              <= prediction["support_probability"]
              <= 1.0
          )
          assert isinstance(
              prediction["predicted_needs_support"],
              bool,
          )
          assert prediction["decision_threshold"] == 0.38
          assert prediction["support_threshold"] == 60.0
          assert (
              prediction["model_name"]
              == "logistic_regression"
          )
          assert (
              prediction["artifact_schema_version"]
              == 1
          )
          assert (
              prediction["human_review_required"]
              is True
          )

          print("Readiness:", readiness)
          print("Model health:", model_health)
          print(
              "Synthetic learner count:",
              len(learners),
          )
          print(
              "Blocked write:",
              blocked_response,
          )
          print("Prediction:", prediction)
          PY

      - name: Show container logs after failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop containerised services
        if: always()
        run: docker compose down --volumes